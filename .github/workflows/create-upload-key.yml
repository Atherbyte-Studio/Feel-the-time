name: Create upload keystore (one-time)

on:
  workflow_dispatch:
    inputs:
      i_understand_public_repo_risk:
        description: "Only needed if this repo is PUBLIC: type YES (see README, section 'Signing')"
        required: false
        default: "NO"

permissions:
  contents: read

jobs:
  keygen:
    runs-on: ubuntu-24.04
    env:
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      IS_PRIVATE: ${{ github.event.repository.private }}
      ACK: ${{ inputs.i_understand_public_repo_risk }}
    steps:
      - name: Safety checks
        run: |
          [ -n "$KS_PASS" ] || { echo "::error::First add the repository secret ANDROID_KEYSTORE_PASSWORD (see README)."; exit 1; }
          [ ${#KS_PASS} -ge 16 ] || { echo "::error::The password must be at least 16 characters."; exit 1; }
          if [ "$IS_PRIVATE" != "true" ] && [ "$ACK" != "YES" ]; then
            echo "::error::This repository is public: anyone logged in to GitHub could download the artifact. Make the repo private first, or re-run with YES (see README)."; exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate keystore
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env KS_PASS -keypass:env KS_PASS -dname "CN=Stop The Timer, O=waseem391"
          base64 -w0 upload-keystore.jks > upload-keystore.jks.base64.txt
          keytool -list -v -keystore upload-keystore.jks -storepass:env KS_PASS | grep -E "Alias name|SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-KEEP-PRIVATE
          path: |
            upload-keystore.jks
            upload-keystore.jks.base64.txt
          retention-days: 1
